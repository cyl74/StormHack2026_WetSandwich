<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Arena Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Doodle Arena: Live</h1>
    <a class="btn small" href="index.html">Create a character</a>
  </header>
  <main class="stream-wrap">
    <div id="player" class="player box"></div>
    <p class="hint center">The stream runs a few seconds behind the arena. Click the player to unmute.</p>
  </main>

  <script type="module">
    import { TWITCH_CHANNEL } from "./config.js";
    const host = window.location.hostname;
    const player = document.getElementById("player");
    if (!host) {
      player.innerHTML = '<p class="error">Open this page through a local server (http://localhost:8000), not as a file. Twitch needs a hostname.</p>';
    } else {
      const src = `https://player.twitch.tv/?channel=${encodeURIComponent(TWITCH_CHANNEL)}` +
                  `&parent=${encodeURIComponent(host)}&muted=true&autoplay=true`;
      player.innerHTML = `<iframe src="${src}" allowfullscreen title="Doodle Arena Twitch stream"></iframe>`;
    }
  </script>
</body>
</html>
